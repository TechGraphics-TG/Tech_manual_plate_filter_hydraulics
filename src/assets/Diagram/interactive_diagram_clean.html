<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hydraulic Diagram - Interactive Points</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #3b82f6;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 20px 0;
    font-size: 14px;
  }
  .diagram-wrap {
    position: relative;
    display: inline-block;
    max-width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .diagram-wrap img.base {
    display: block;
    width: 100%;
    height: auto;
    max-width: 988px;
  }
  .marker {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.15);
    border: 2px solid var(--accent);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    backdrop-filter: blur(1px);
  }
  .marker:hover {
    transform: scale(1.18);
    background: rgba(59, 130, 246, 0.35);
    box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12);
  }
  .marker.pulse::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0.6;
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.8); opacity: 0.7; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .legend {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .legend button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .legend .num {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #0f1115;
    font-weight: 700;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-width: 900px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  .modal-header h2 {
    font-size: 16px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-header .num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #0f1115;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .close-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .close-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .modal-body {
    padding: 18px;
  }
  .modal-body img {
    width: 100%;
    height: auto;
    border-radius: 6px;
    display: block;
  }
  .modal-nav {
    display: flex;
    justify-content: space-between;
    padding: 12px 18px 18px;
  }
  .modal-nav button {
    background: #23262e;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .modal-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .modal-nav button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>

  };

  const overlay = document.getElementById('overlay');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalNum = document.getElementById('modalNum');
  const closeBtn = document.getElementById('closeBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let current = 1;

  function openPoint(n) {
    n = parseInt(n);
    current = n;
    const p = points[n];
    modalImg.src = p.img;
    modalTitle.textContent = p.title;
    modalNum.textContent = n;
    prevBtn.disabled = n <= 1;
    nextBtn.disabled = n >= 5;
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  document.querySelectorAll('[data-point]').forEach(el => {
    el.addEventListener('click', () => openPoint(el.getAttribute('data-point')));
  });

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if (overlay.classList.contains('open')) {
      if (e.key === 'ArrowRight' && current < 5) openPoint(current + 1);
      if (e.key === 'ArrowLeft' && current > 1) openPoint(current - 1);
    }
  });
  prevBtn.addEventListener('click', () => { if (current > 1) openPoint(current - 1); });
  nextBtn.addEventListener('click', () => { if (current < 5) openPoint(current + 1); });
</script>
